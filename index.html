<body>
<canvas id="c"></canvas>
<div id="start">[ Klicken, um Kamera zu starten ]</div>
<div id="ui">
  <label>Zeichengröße <input id="size" type="range" min="10" max="40" value="20"></label>
  <label>Regen-Tempo <input id="speed" type="range" min="1" max="20" value="8"></label>
  <label>Kontrast <input id="contrast" type="range" min="5" max="30" value="14"></label>
  <label>Schrift <select id="font">
    <option value="matrix">Matrix (Original)</option>
    <option value="'Press Start 2P'">Press Start 2P (Pixel)</option>
    <option value="'VT323'">VT323 (Terminal)</option>
    <option value="'Silkscreen'">Silkscreen (Pixel)</option>
    <option value="'Pixelify Sans'">Pixelify Sans</option>
    <option value="'Share Tech Mono'">Share Tech Mono</option>
    <option value="'Fira Code'">Fira Code</option>
    <option value="'Major Mono Display'">Major Mono Display</option>
    <option value="'MS Gothic'">MS Gothic (Katakana)</option>
    <option value="blocks">ASCII-Blöcke ░▒▓█</option>
    <option value="Consolas">Consolas</option>
    <option value="'Courier New'">Courier New</option>
  </select></label>
  <label>Eigene Schrift (.ttf/.otf) <input id="fontfile" type="file" accept=".ttf,.otf,.woff,.woff2"></label>
  <div>H = Menü ein/aus</div>
</div>
<video id="v" playsinline muted hidden></video>
<script>

const ui = id => document.getElementById(id);

const MATRIX_GLYPHS = '\u0022\u002a\u002b\u0030\u0031\u0032\u0033\u0034\u0035\u0037\u0038\u0039\u003a\u003c\u003e\u007a\u007c\u00a6\u254c\u30a2\u30a6\u30a8\u30aa\u30ab\u30ad\u30b1\u30b3\u30b5\u30b7\u30b9\u30bb\u30bd\u30bf\u30c4\u30c6\u30ca\u30cb\u30cc\u30cd\u30cf\u30d2\u30db\u30de\u30df\u30e0\u30e1\u30e2\u30e4\u30e8\u30e9\u30ea\u30ef\u30fc\ua78a';
const ASCII_GLYPHS = '0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%&*+=<>?!/\|';
const KATA_GLYPHS = 'ｱｲｳｴｵｶｷｸｹｺｻｼｽｾｿﾀﾁﾂﾃﾄﾅﾆﾇﾈﾉﾊﾋﾌﾍﾎﾏﾐﾑﾒﾓﾔﾕﾖﾗﾘﾙﾚﾛﾜﾝ0123456789';
let GLYPHS = MATRIX_GLYPHS;
// Blöcke nach Helligkeit statt zufälliger Zeichen
const BLOCKS = '░▒▓█';
let blockMode = false;
let FONT = '"Matrix Code", monospace';

// Schrift live wechseln; jede Schrift bekommt nur Zeichen, die sie auch enthält
async function setFont(family, glyphSet) {
  FONT = `${family}, monospace`;
  GLYPHS = glyphSet;
  await document.fonts.load(`20px ${family}`).catch(() => {});
  if (video.srcObject) layout();
}
ui('font').onchange = e => {
  const v = e.target.value;
  blockMode = v === 'blocks';
  if (blockMode) return setFont('Consolas', BLOCKS);
  if (v === 'matrix') setFont('"Matrix Code"', MATRIX_GLYPHS);
  else setFont(v, v === "'MS Gothic'" ? KATA_GLYPHS : ASCII_GLYPHS);
};
ui('fontfile').onchange = async e => {
  const file = e.target.files[0];
  if (!file) return;
  blockMode = false;
  const face = new FontFace('Eigene Schrift', await file.arrayBuffer());
  document.fonts.add(await face.load());
  setFont('"Eigene Schrift"', ASCII_GLYPHS);
};

let cell, cols, rows, drops, glyphs;

function layout() {
  cell = +ui('size').value;
  canvas.width = innerWidth * devicePixelRatio;
  canvas.height = innerHeight * devicePixelRatio;
  ctx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  cols = Math.ceil(innerWidth / cell);
  rows = Math.ceil(innerHeight / cell);
  sample.width = cols; sample.height = rows;
  drops = Array.from({ length: cols }, () => ({
    y: Math.random() * rows * -1,
    v: 0.5 + Math.random(),
    len: 8 + Math.random() * 25,
  }));
  glyphs = Array.from({ length: cols * rows }, () => GLYPHS[Math.random() * GLYPHS.length | 0]);
  ctx.font = `${cell}px ${FONT}`;
  ctx.textBaseline = 'top';
}

function frame() {
  const speed = +ui('speed').value / 40;
  const contrast = +ui('contrast').value / 10;

  // Kamerabild gespiegelt auf Rastergröße herunterskalieren
  const vw = video.videoWidth, vh = video.videoHeight;
  const scale = Math.max(cols / vw, rows / vh);
  const dw = vw * scale, dh = vh * scale;
  sctx.save();
  sctx.translate(cols, 0); sctx.scale(-1, 1);
  sctx.drawImage(video, (cols - dw) / 2, (rows - dh) / 2, dw, dh);
  sctx.restore();
  const px = sctx.getImageData(0, 0, cols, rows).data;

  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, innerWidth, innerHeight);

  for (let x = 0; x < cols; x++) {
    const d = drops[x];
    d.y += d.v * speed * 2;
    if (d.y - d.len > rows) { d.y = -Math.random() * 20; d.v = 0.5 + Math.random(); d.len = 8 + Math.random() * 25; }

    for (let y = 0; y < rows; y++) {
      const i = (y * cols + x) * 4;
      let lum = (0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]) / 255;
      lum = Math.min(1, Math.max(0, (lum - 0.5) * contrast + 0.5));

      // Regenspur: hell am Kopf, verblasst nach oben
      const dist = d.y - y;
      const trail = dist >= 0 && dist < d.len ? 1 - dist / d.len : 0;
      const head = dist >= 0 && dist < 1;

      // nur zeichnen, wo das Kamerabild wirklich etwas zeigt
      if (lum < 0.15) continue;
      const b = lum * (0.55 + 0.45 * trail);

      const gi = y * cols + x;
      if (Math.random() < 0.02 + trail * 0.1) glyphs[gi] = GLYPHS[Math.random() * GLYPHS.length | 0];
      const ch = blockMode ? BLOCKS[Math.min(3, lum * 4 | 0)] : glyphs[gi];

      if (head) {
        ctx.fillStyle = `rgba(200,255,200,${lum})`;
      } else {
        ctx.fillStyle = `rgb(${b * 80 | 0},${(60 + b * 195) | 0},${b * 70 | 0})`;
        ctx.globalAlpha = Math.min(1, b * 1.4);
      }
      ctx.fillText(ch, x * cell, y * cell);
      ctx.globalAlpha = 1;
    }
  }
  requestAnimationFrame(frame);
}

ui('start').onclick = async () => {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720, facingMode: 'user' } });
    video.srcObject = stream;
    await video.play();
    await document.fonts.load('20px "Matrix Code"');
    ui('start').remove();
    layout();
    requestAnimationFrame(frame);
  } catch (e) {
    ui('start').textContent = 'Kamera-Zugriff fehlgeschlagen: ' + e.message;
  }
};
ui('size').oninput = () => video.srcObject && layout();
addEventListener('resize', () => video.srcObject && layout());
addEventListener('keydown', e => { if (e.key.toLowerCase() === 'h') ui('ui').classList.toggle('hidden'); });
</script>
</body>
</html>
